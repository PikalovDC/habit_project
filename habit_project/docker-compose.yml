version: '3.8'

services:
  db:
    image: postgres:15
    container_name: habit_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${NAME:-habits}
      POSTGRES_USER: ${USER:-tracker_user}
      POSTGRES_PASSWORD: ${PASSWORD:-tracker_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER:-tracker_user}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - habit_network

  redis:
    image: redis:7-alpine
    container_name: habit_redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - habit_network

  web:
    build: .
    container_name: habit_web
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY}
      - NAME=${NAME:-habits}
      - USER=${USER:-tracker_user}
      - PASSWORD=${PASSWORD:-tracker_password}
      - HOST=db
      - PORT=${PORT:-5432}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - STRIPE_PUBLIC_KEY=${STRIPE_PUBLIC_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_SUCCESS_URL=${STRIPE_SUCCESS_URL}
      - STRIPE_CANCEL_URL=${STRIPE_CANCEL_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - habit_network

  celery:
    build: .
    container_name: habit_celery
    command: celery -A celery_app worker --loglevel=info -P eventlet
    volumes:
      - .:/app
    environment:
      - NAME=${NAME:-habits}
      - USER=${USER:-tracker_user}
      - PASSWORD=${PASSWORD:-tracker_password}
      - HOST=db
      - PORT=${PORT:-5432}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - habit_network

  celery-beat:
    build: .
    container_name: habit_celery_beat
    command: celery -A celery_app beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    environment:
      - NAME=${NAME:-habits}
      - USER=${USER:-tracker_user}
      - PASSWORD=${PASSWORD:-tracker_password}
      - HOST=db
      - PORT=${PORT:-5432}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - habit_network

  nginx:
    image: nginx:alpine
    container_name: habit_nginx
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - static_volume:/static
      - media_volume:/media
    ports:
      - "80:80"
    depends_on:
      - web
    networks:
      - habit_network

networks:
  habit_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume: