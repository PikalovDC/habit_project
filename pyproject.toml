[project]
name = "habit-project"
version = "0.1.0"
description = "Habit tracker backend for Telegram notifications"
authors = [
    {name = "Your Name", email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django>=6.0.3,<7.0.0",
    "djangorestframework>=3.17.0,<4.0.0",
    "djangorestframework-simplejwt>=5.5.1,<6.0.0",
    "django-filter>=25.2,<26.0",
    "django-celery-beat>=2.9.0,<3.0.0",
    "django-cors-headers>=4.9.0,<5.0.0",
    "psycopg2-binary>=2.9.11,<3.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "pillow>=12.1.1,<13.0.0",
    "PyJWT>=2.12.1,<3.0.0",
    "celery>=5.6.3,<6.0.0",
    "redis>=7.4.0,<8.0.0",
    "eventlet>=0.41.0,<0.42.0",
    "drf-yasg>=1.21.15,<2.0.0",
    "requests>=2.33.1,<3.0.0",
    "coverage>=7.13.5,<8.0.0"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
